name: Publish
on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  github-publish-docker-image:
    name: Build and publish docker image to Github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get the Docker tag for GHCR
        id: ghcr-tag
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install
        run: |
          corepack enable

          yarn workspaces focus --all --production
          yarn install --immutable



      - name: yarn build
        run: yarn build

      - name: Set up Docker Buildx
        if: steps.ghcr-tag.outputs.tags != 0
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.ghcr-tag.outputs.tags != 0
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: steps.ghcr-tag.outputs.tags != 0
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          labels: ${{ steps.ghcr-tag.outputs.labels }}
          tags: "${{ steps.ghcr-tag.outputs.tags }}"
          github-token: ${{ github.token }}
